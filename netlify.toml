[build]
  publish = "."
  command = ""

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# El aula no tiene que aparecer en Google
[[headers]]
  for = "/curso/*"
  [headers.values]
    X-Robots-Tag = "noindex"

# Código del servidor y archivos internos: no se publican como páginas
[[redirects]]
  from = "/lib/*"
  to = "/404"
  status = 404
  force = true
[[redirects]]
  from = "/supabase/*"
  to = "/404"
  status = 404
  force = true
[[redirects]]
  from = "/netlify/*"
  to = "/404"
  status = 404
  force = true
[[redirects]]
  from = "/node_modules/*"
  to = "/404"
  status = 404
  force = true
[[redirects]]
  from = "/package*"
  to = "/404"
  status = 404
  force = true
[[redirects]]
  from = "/.env.example"
  to = "/404"
  status = 404
  force = true
